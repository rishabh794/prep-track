server:
  port: 8080

spring:
  application:
    name: preptrack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/preptrack}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      keepalive-time: 30000
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  timeout-ms: ${OPENAI_TIMEOUT_MS:5000}
  max-tokens: ${OPENAI_MAX_TOKENS:300}

preptrack:
  seed:
    enabled: ${PREPTRACK_SEED_ENABLED:true}
  engine:
    default-budget-minutes: 90
    default-max-new-problems: 3
    default-max-revisions: 10
    default-target-skill: 0.8
    maintenance-floor: 0.15
    diversity-multiplier: 0.5
    retry-boost-multiplier: 2.0

